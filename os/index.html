<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivit | OS</title>
    <link rel="icon" type="image/png" href="../Trivit Logo Light Square.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header class="site-header">
        <a class="logo control" href="../" aria-label="Trivit home">
            <span class="control-face"><img src="../Trivit Logo Light Rounded.png" alt="" width="34" height="34"></span>
        </a>
        <nav aria-label="Main navigation">
            <a class="tab-link control" href="../os/" aria-current="page"><span class="control-face">OS</span></a>
            <a class="tab-link control" href="../games/"><span class="control-face">GAMES</span></a>
        </nav>
        <button class="auth-trigger control" type="button" aria-controls="auth-panel" aria-expanded="false" aria-haspopup="dialog"><span class="control-face">LOG IN</span></button>
    </header>

    <main class="page-main">
        <section class="window-body download-card" aria-labelledby="download-title">
            <img class="download-logo" src="../Trivit Logo Light Rounded.png" width="160" height="160" alt="">
            <h1 class="download-title" id="download-title">Trivit OS</h1>
            <a class="control download-button" href="https://github.com/trivit-main/trivit/releases/download/v0.8/trivit-os.iso" download="trivit-os.iso">
                <span class="control-face">Download</span>
            </a>
        </section>
    </main>

    <script src="../script.js"></script>
</body>
</html>
